<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPC 透明办公室 — Gavin's Lab</title>
<style>
:root {
  --bg: #f7f7f8; --fg: #1a1a1e; --muted: #6b6b73;
  --card: #ffffff; --border: #e4e4e8; --accent: #1a1a1e;
  --green: #16a34a; --gray: #9ca3af;
  --demo-border: #ddd3f5; --demo-card-bg: #fdfbff;
}
[data-theme="dark"] {
  --bg: #141417; --fg: #ececef; --muted: #9a9aa3;
  --card: #1d1d22; --border: #2a2a31; --accent: #ececef;
  --green: #22c55e; --gray: #52525b;
  --demo-border: #4c3d7a; --demo-card-bg: #221c33;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 8px 24px 32px; }
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.logo svg { width: 26px; height: 26px; color: var(--accent); }
.logo .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 4px; }
.hdr-actions { display: flex; align-items: center; gap: 12px; }
.back { font-size: 13px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--fg); }
.theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--fg); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.panel-head h2 { font-size: 15px; font-weight: 600; }
.panel-head .hint { font-size: 12px; color: var(--muted); }
#office { width: 100%; display: block; }
.canvas-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.feed { max-height: 560px; overflow-y: auto; }
.feed-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed-item:last-child { border-bottom: none; }
.feed-item .t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed-item .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
.feed-item .dot.active { background: var(--green); }
.feed-item .dot.idle { background: var(--gray); }
.feed-item .who { font-weight: 600; white-space: nowrap; }
.feed-item .what { color: var(--muted); }
.feed-item .what.fail { color: #dc2626; }
.feed-item .act-tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--border); color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.feed-item .act-tag.done { background: rgba(22, 163, 74, .14); color: var(--green); }
.feed-item .dot.fail { background: #dc2626; }
.legend { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ===== Tab 导航 ===== */
.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; background: none; border: none; box-shadow: inset 0 -2px 0 transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: color .15s, box-shadow .15s; }
.tab-btn svg { width: 15px; height: 15px; }
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ===== Kanban 看板 ===== */
.kb-members { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; padding: 14px 18px; }
.kb-member { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.kb-member .nm { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kb-member .nm .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
.kb-member .nm .dot.run { background: var(--green); }
.kb-member .nm .dot.blk { background: #dc2626; }
.kb-member .cnt { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.kb-member .latest { font-size: 11.5px; color: var(--muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kb-member .latest::before { content: "最近 · "; color: var(--muted); }
.kb-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px 18px; }
.kb-col { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; min-height: 90px; }
.kb-col-head { padding: 8px 12px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; color: var(--muted); }
.kb-col-head .n { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 500; }
.kb-col-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
.kb-col-head .dot.run { background: var(--green); }
.kb-col-head .dot.blk { background: #dc2626; }
.kb-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin: 8px; padding: 10px 12px; }
.kb-card .tt { font-weight: 600; font-size: 12.5px; line-height: 1.45; }
.kb-card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
.kb-card .meta .who { font-weight: 600; color: var(--fg); display: inline-flex; align-items: center; gap: 4px; }
.kb-card .meta .who svg, .kb-card .meta .tm svg { width: 12px; height: 12px; }
.kb-card .meta .tm { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.kb-card .prio { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--border); color: var(--muted); font-variant-numeric: tabular-nums; }
.kb-card .why { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 11.5px; color: #b45309; }
.kb-card .why svg { width: 12px; height: 12px; flex-shrink: 0; }
.kb-summary { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.kb-summary b { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }
.kb-empty { padding: 26px 18px; text-align: center; color: var(--muted); font-size: 12px; }

/* ===== Kanban demo 分区（22-4：访客体验任务，独立隔离板，视觉区分）===== */
.kb-demo-panel { border: 1px solid var(--demo-border); }
.kb-demo-panel .panel-head { background: linear-gradient(90deg, rgba(124, 58, 237, .06), transparent 55%); }
.kb-demo-panel .panel-head h2 { display: inline-flex; align-items: center; gap: 8px; }
.kb-demo-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 999px;
  color: #fff; background: linear-gradient(135deg, #7c3aed, #a855f7);
  box-shadow: 0 1px 3px rgba(124, 58, 237, .35);
}
.kb-demo-badge svg { width: 10px; height: 10px; }
.kb-demo-note { font-size: 12px; color: var(--muted); }
.kb-card.demo { border-color: var(--demo-border); border-left: 3px solid #a855f7; background: var(--demo-card-bg); }
.kb-card.demo .tt { display: flex; align-items: flex-start; gap: 6px; }
.kb-card.demo .tt .tt-text { min-width: 0; }
.kb-demo-tag {
  flex-shrink: 0; display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
  color: #a855f7; background: rgba(124, 58, 237, .1); border: 1px solid rgba(124, 58, 237, .28);
}
.kb-col-head .dot.demo { background: #a855f7; }


/* ===== Demo 体验（12b）===== */
.tabs .demo-btn {
  margin-left: auto;
  margin-bottom: 13px;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 14px; /* 上下 9px 与 .tab-btn 一致；去掉负 margin，margin box = border box，align-items:center 即内容居中 */
  background: var(--card); color: var(--fg);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.tabs .demo-btn svg { width: 15px; height: 15px; }
.tabs .demo-btn:hover { border-color: var(--accent); }
.modal-mask {
  position: fixed; inset: 0; background: rgba(20, 20, 23, .45);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 24px;
}
.modal-mask.show { display: flex; }
/* 22-7: pop 面板打开时锁定背景滚动（桌面滚轮 + 移动触摸），关闭恢复且不丢位置 */
html.scroll-lock, body.scroll-lock { overflow: hidden; }
.modal-body, .report-pane, #histList, .report-cols { overscroll-behavior: contain; }
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 580px; max-height: 86vh; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .18);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.modal-head h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.modal-head h3 svg { width: 16px; height: 16px; }
.modal-close {
  background: none; border: none; color: var(--muted); cursor: pointer;
  display: inline-flex; padding: 4px; border-radius: 6px;
}
.modal-close:hover { color: var(--fg); background: var(--bg); }
.modal-close svg { width: 16px; height: 16px; }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.demo-card {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  cursor: pointer; background: var(--card); font-family: inherit; text-align: left;
  transition: border-color .15s, background .15s;
}
.demo-card:hover { border-color: var(--accent); background: var(--bg); }
.demo-card:disabled { opacity: .55; cursor: not-allowed; }
.demo-card .ic {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.demo-card .ic svg { width: 17px; height: 17px; }
.demo-card .tx { min-width: 0; }
.demo-card .tx .t { display: block; font-size: 13px; font-weight: 600; }
.demo-card .tx .d { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
@media (max-width: 520px) { .demo-grid { grid-template-columns: 1fr; } }
.modal-note { font-size: 12.5px; margin-top: 12px; border-radius: 8px; padding: 8px 12px; display: none; line-height: 1.5; }
.modal-note.err { display: block; color: #b91c1c; background: rgba(220, 38, 38, .08); border: 1px solid rgba(220, 38, 38, .25); }
.modal-note.ok { display: block; color: var(--green); background: rgba(22, 163, 74, .08); border: 1px solid rgba(22, 163, 74, .25); }

/* demo 进度条（看板 tab 头部） */
.demo-progress { margin-bottom: 16px; display: none; }
.demo-progress.show { display: block; }
.demo-steps { display: flex; align-items: flex-start; padding: 18px 22px 8px; }
.demo-step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; position: relative; }
.demo-step .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); background: var(--card); }
.demo-step.done .dot { background: var(--green); border-color: var(--green); }
.demo-step.cur .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--border); animation: demo-pulse 1.6s ease-in-out infinite; }
.demo-step.fail .dot { background: #dc2626; border-color: #dc2626; }
.demo-step .lbl { font-size: 12px; color: var(--muted); white-space: nowrap; }
.demo-step.done .lbl, .demo-step.cur .lbl { color: var(--fg); font-weight: 600; }
.demo-step::after { content: ""; position: absolute; top: 5px; left: calc(50% + 8px); width: calc(100% - 16px); height: 2px; background: var(--border); }
.demo-step:last-child::after { display: none; }
.demo-step.done::after { background: var(--green); }
@keyframes demo-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.demo-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 18px 16px; font-size: 12px; flex-wrap: wrap; }
.demo-meta .row { display: inline-flex; align-items: center; gap: 6px; }
.demo-meta .row svg { width: 13px; height: 13px; flex-shrink: 0; }
.demo-meta .muted { color: var(--muted); }
.demo-meta .muted::before { content: " · "; color: var(--muted); }

/* 报告弹窗 markdown 渲染 + 历史回看（22-6 左右分栏：左历史列表 + 右报告内容） */
.report-body { font-size: 13.5px; line-height: 1.7; }
.report-body h1, .report-body h2, .report-body h3 { margin: 14px 0 8px; line-height: 1.4; font-weight: 600; }
.report-body h1 { font-size: 17px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.report-body h2 { font-size: 15px; }
.report-body h3 { font-size: 13.5px; }
.report-body p { margin: 6px 0; }
.report-body ul, .report-body ol { margin: 6px 0; padding-left: 20px; }
.report-body li { margin: 3px 0; }
.report-body a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.report-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.report-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
.report-body pre code { background: none; border: none; padding: 0; }
.report-body table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 12.5px; }
.report-body th, .report-body td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
.report-body th { background: var(--bg); font-weight: 600; }
.report-body blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); margin: 8px 0; }
.report-body hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.report-loading, .report-empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 12.5px; }
/* 22-6：报告弹窗加宽以容纳左右分栏（仅报告弹窗，demoModal 不受影响） */
#reportModal .modal { max-width: 860px; }
.report-cols { display: flex; flex: 1; min-height: 0; overflow: hidden; }
.hist-pane {
  width: 250px; flex-shrink: 0; min-height: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.hist-pane .hist-head {
  padding: 12px 16px 8px; font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.hist-pane .hist-head svg { width: 13px; height: 13px; }
#histList { overflow-y: auto; min-height: 0; flex: 1; padding-bottom: 8px; }
.hist-item { display: flex; align-items: center; gap: 8px; padding: 9px 16px; font-size: 12.5px; border-top: 1px solid var(--border); cursor: pointer; }
.hist-item:hover { background: var(--bg); }
.hist-item.selected { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
.hist-item.selected .hist-lbl { font-weight: 600; }
.hist-item svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--muted); }
.hist-item .hist-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-item .tm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; flex-shrink: 0; margin-left: auto; }
.hist-item .st { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--border); color: var(--muted); flex-shrink: 0; }
.hist-item .st.ok { background: rgba(22, 163, 74, .14); color: var(--green); }
.hist-item .st.fail { background: rgba(220, 38, 38, .12); color: #dc2626; }
.report-pane { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 18px; }

/* 全局轻提示 */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(10px);
  background: var(--fg); color: var(--bg); font-size: 12.5px;
  padding: 9px 16px; border-radius: 8px; z-index: 200; opacity: 0;
  pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* 连接提示条（SSE 断线/降级时显示，页面不白屏） */
.conn-bar {
  display: none; align-items: center; gap: 8px;
  padding: 8px 14px; margin-bottom: 12px;
  border: 1px solid rgba(220, 38, 38, .25); border-radius: 10px;
  background: rgba(220, 38, 38, .06); color: #b91c1c; font-size: 12.5px;
}
.conn-bar.show { display: flex; }
.conn-bar svg { width: 14px; height: 14px; flex-shrink: 0; }
@media (max-width: 1100px) { .kb-cols { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .kb-cols { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

/* ===== 移动端适配（17b）===== */
/* canvas 保持可读比例：窄屏下 1180 位图等比缩放到 560px 宽（不再 100% 压缩到 310px 不可读），
   外层 .canvas-scroll 横向滚动查看，页面本身无横向滚动 */
@media (max-width: 900px) {
  #office { width: 560px; }
}
@media (max-width: 620px) {
  /* header 单行：隐藏副标题（移动端空间有限），返回链接/按钮可点区域 ≥44px */
  .logo .sub { display: none; }
  header { flex-wrap: wrap; gap: 4px 12px; }
  .back { display: inline-flex; align-items: center; min-height: 44px; }
  .hdr-actions { margin-left: auto; }
  .theme-btn { min-height: 44px; }
  .tab-btn { min-height: 44px; }
  .tabs .demo-btn { min-height: 44px; }
  /* 弹窗关闭按钮可点区域 ≥44px */
  .modal-close { min-width: 44px; min-height: 44px; align-items: center; justify-content: center; }
  /* 活动流：时间戳/动作标签不再强制不换行，避免窄屏挤压 */
  .feed-item { flex-wrap: wrap; }
  .feed-item .t { white-space: nowrap; }
  .feed-item .what { min-width: 0; flex: 1 1 auto; }
  /* 22-6：报告弹窗窄屏改上下堆叠——历史列表在上（限高滚动），报告在下，不横向溢出 */
  #reportModal .modal { max-width: 100%; }
  .report-cols { flex-direction: column; overflow-y: auto; }
  .hist-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 200px; }
  #histList { overflow-y: auto; }
  .report-pane { overflow-y: visible; }
}
/* tab 栏窄屏单行（21b）：压缩间距/字号 + 隐藏 tab 后缀文字，375px 下三按钮一行不换行 */
@media (max-width: 520px) {
  .tabs { gap: 4px; }
  .tab-btn { padding: 9px 8px; font-size: 12.5px; gap: 5px; }
  .tab-btn svg { width: 13px; height: 13px; }
  .tab-btn .ts { display: none; }
  .tabs .demo-btn { padding: 8px 10px; font-size: 12.5px; gap: 5px; }
  .tabs .demo-btn svg { width: 13px; height: 13px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="conn-bar" id="connBar" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span>实时连接已断开，正在重连…</span>
  </div>

<script>
(function () {
  // ===== 主题 =====
  var KEY = 'gavinlab-theme-v2';
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
  function apply(t) { root.setAttribute('data-theme', t); }
  if (saved) apply(saved);
  else apply(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function icon(isDark) {
    return isDark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:-2px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:-2px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  }
  function syncBtn() {
    var t = root.getAttribute('data-theme');
    btn.innerHTML = (t === 'dark' ? icon(false) + ' 亮色' : icon(true) + ' 暗色');
  }
  btn.addEventListener('click', function () {
    var t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(t); try { localStorage.setItem(KEY, t); } catch (e) {} syncBtn();
  });
  syncBtn();

  // ===== 素材 =====
  var canvas = document.getElementById('office');
  var ctx = canvas.getContext('2d');
  var CW = canvas.width, CH = canvas.height;
  var BASE = '/company/opc/img/';

  var floorImg = new Image(); floorImg.src = BASE + 'floor.png';
  var loungeImg = new Image(); loungeImg.src = BASE + 'lounge.png';
  var meetingImg = new Image(); meetingImg.src = BASE + 'meeting.png';
  var deskImgs = [new Image(), new Image(), new Image()];
  deskImgs[0].src = BASE + 'desk-1.png'; deskImgs[1].src = BASE + 'desk-2.png'; deskImgs[2].src = BASE + 'desk-3.png';
  var avatars = {};


  // ===== 静态布局：办公室家具（位置锁定，不随人的状态变化）=====
  var LOUNGE = { x: 0, y: 0, w: 462, h: 220 };
  var WALL_H = 70;           // 办公室上部墙高度（会客室左边距也用它）
  var MEETING = { x: 718, y: 0, w: 462, h: 251 };
  var DW = 140, DH = 117;   // 工位缩小 10%（原 155×130）
  var ZZ_W = 117, ZZ_H = 140; // 庄子桌旋转90度后尺寸（竖放）

  // 工位桌固定位置（无论人是什么状态，桌子永远在此，不随人移动/消失）
  var DESKS = [
    { id: 'zhuangzi', x: 118, y: 395 },
    { id: 'make',     x: 375, y: 338 },
    { id: 'anran',    x: 515, y: 338 },
    { id: 'linjing',  x: 655, y: 338 },
    { id: 'ada',      x: 795, y: 338 },
    { id: 'wenwen',   x: 375, y: 475 },
    { id: 'qianli',   x: 515, y: 475 },
    { id: 'panming',  x: 655, y: 475 },
  ];

  // ===== 成员状态持久化 =====
  // 每个人在不同「状态」下有不同头像位置，ax/ay = 头像中心 canvas 坐标。
  // 人与家具完全解耦：人按状态移动，工位桌等家具始终锁定原位。
  // 未来新增状态（如 away/idle）只需在 states 加坐标；未定义回退 working 默认。
  var MEMBER_STATES = {
    zhuangzi: { name: '庄子', role: 'CEO',  states: {
      working: { ax: 142.5, ay: 463.8 },
      meeting: { ax: 809,   ay: 152 }       // 会议桌左端桌头(主位)
    } },
    make:     { name: '马克', role: '开发', states: {
      working: { ax: 445, ay: 367.94 },
      meeting: { ax: 874, ay: 86 }          // 会议桌上排左
    } },
    anran:    { name: '安然', role: '运维', states: {
      working: { ax: 585, ay: 367.94 },
      meeting: { ax: 949, ay: 86 }          // 会议桌上排中
    } },
    linjing:  { name: '林静', role: '营销', states: {
      working: { ax: 725, ay: 367.94 },
      meeting: { ax: 1024, ay: 86 }         // 会议桌上排右
    } },
    wenwen:   { name: '温雯', role: '客服', states: {
      working: { ax: 445, ay: 557.94 },
      meeting: { ax: 874, ay: 217 }         // 会议桌下排左
    } },
    qianli:   { name: '钱莉', role: '财务', states: {
      working: { ax: 585, ay: 557.94 },
      meeting: { ax: 949, ay: 217 }         // 会议桌下排中
    } },
    panming:  { name: '潘明', role: '竞品', states: {
      working: { ax: 725, ay: 557.94 },
      meeting: { ax: 1024, ay: 217 }        // 会议桌下排右
    } },
    ada:      { name: '蔡婉', role: '测试', states: {
      working: { ax: 865, ay: 367.94 },     // 上排右侧延伸（对齐上排工位中心）
      meeting: { ax: 1100, ay: 152 }        // 会议桌右侧空位（避开桌右缘 1073）
    } },
  };

  // status.json 成员 → 状态键：meet→开会、active→工作中、其余→空闲
  var DEBUG_STATE = null;   // 预览参数：?state=meeting 强制所有人为指定状态（微调坐标用）
  try { DEBUG_STATE = new URLSearchParams(location.search).get('state'); } catch (e) {}
  function resolveState(m) {
    if (m && m.status === 'active') {
      return (m.action === 'meet') ? 'meeting' : 'working';   // 活跃：开会→meeting，其他→working
    }
    return 'idle';   // 不活跃：一律 idle（不管 action，避免"开完会仍钉在会议室"）
  }
  function stateOf(id) {
    if (DEBUG_STATE) return DEBUG_STATE;   // 预览参数优先（微调坐标时不被会议聚合干扰）
    if (!data) return 'working';
    // 会议聚合（v1.0.63，14b）：status.json 顶层 meeting.active=true 时，
    // attendees（被召集成员）目标状态强制=meeting——任何真实状态（含 idle）都进会议室；
    // 非 attendees 维持下方 resolveState 独立判断（绝不一律进会议室）。
    // 会议解散（active=false 或字段消失）→ 覆盖失效 → 自动恢复各自真实状态解析。
    var mt = data.meeting;
    if (mt && mt.active === true && Array.isArray(mt.attendees) && mt.attendees.indexOf(id) >= 0) {
      return 'meeting';
    }
    var m = data.members && data.members.find(function (x) { return x.id === id; });
    return resolveState(m);
  }
  // ===== 会客区座位（静态，与人物解耦）=====
  // 4 个座位坐标固定；idle 成员按顺序抢占空位，超出 4 人者留工位。
  // 座位是家具的一部分，绝不随人物状态移动/消失。
  var LOUNGE_SEATS = [
    { id: 'lounge-s1', ax: 153, ay: 95 },   // 长条沙发1（靠墙横条）
    { id: 'lounge-s2', ax: 213, ay: 95 },   // 长条沙发2（面对面）
    { id: 'lounge-s3', ax: 110, ay: 162 },  // 小沙发1（左下）
    { id: 'lounge-s4', ax: 270, ay: 162 },  // 小沙发2（右下）
  ];
  var idleSeatAssign = {};   // memberId -> { ax, ay }（每帧重算）
  var NO_LOUNGE_IDS = ['zhuangzi', 'ada'];   // 这些人 idle 时不去会客区，留工位
  function computeSeats() {
    idleSeatAssign = {};
    var seatIdx = 0;
    Object.keys(MEMBER_STATES).forEach(function (id) {
      if (NO_LOUNGE_IDS.indexOf(id) >= 0) return;
      if (stateOf(id) !== 'idle') return;
      if (seatIdx < LOUNGE_SEATS.length) idleSeatAssign[id] = LOUNGE_SEATS[seatIdx++];
    });
  }
  // 取成员当前状态的头像中心坐标：查状态表，未定义回退 working 默认
  function memberPos(id) {
    var st = MEMBER_STATES[id] && MEMBER_STATES[id].states;
    if (!st) return null;
    var s = stateOf(id);
    if (s === 'idle') {
      var seat = idleSeatAssign[id];
      return seat ? { ax: seat.ax, ay: seat.ay } : (st.working || null);   // 有座位坐会客区，没空位留工位
    }
    return st[s] || st.working || null;
  }

  // ===== 移动动画（v1.0.60：状态切换沿折线路径平滑移动，杜绝瞬移）=====
  // 每个成员维护 currentPos(动画实际位置) + targetPos(状态目标坐标) + 移动状态。
  // 状态/座位变化只更新 targetPos → 从 currentPos 重规划路径（不重置位置，天然抗抖动横跳）。
  // 家具（工位桌/会议桌/会客区沙发）位置全部锁定，路径只动「人」——人走桌留。
  // 走廊常量（俯视布局：会客区左上、会议室右上、工位区下部两排）：
  var AISLE_Y = 290;     // 工位区上方水平走廊（会客区下缘 220 与工位桌顶 338 之间）
  var BOT_Y = 640;       // 工位区下方走廊
  var RIGHT_X = 1100;    // 会议室右侧竖直走廊（避开会议桌 bbox 右缘 1073）
  var LEFT_X = 305;      // 工位区左侧竖直走廊（庄子桌右缘 235 与马克桌左缘 375 之间）
  var TBL_TOP = 100;     // 会议桌顶 110 上方的横穿线（桌头绕桌用）
  var MOVE_SPEED = 0.6;  // 移动速度 px/ms，单次移动时长 clamp 0.5~1.5s
  function zoneOf(p) {
    if (p.y <= 251 && p.x >= 718) return 'meeting';
    if (p.y <= 220 && p.x < 462) return 'lounge';
    return 'desk';
  }
  // 起点/终点之间的折线路径（waypoints 数组；横/竖正交折线，沿走廊绕开桌椅）
  function pathTo(from, to) {
    var fz = zoneOf(from), tz = zoneOf(to);
    if (fz === tz) return [{ x: to.x, y: to.y }];          // 同区域（会客区换座/会议室换位）直线
    var pts = [];
    var wy = to.y < 455 ? AISLE_Y : BOT_Y;                 // 目标工位行外的走廊（入座段）
    var isHead = to.y >= 110 && to.y <= 195;               // 会议桌头（y 落在桌 bbox 内）
    if (fz === 'desk') {
      var sy = from.y < 455 ? AISLE_Y : BOT_Y;             // 先竖走出工位行
      if (tz === 'meeting') {
        pts.push({ x: from.x, y: sy }, { x: RIGHT_X, y: sy }, { x: RIGHT_X, y: to.y });
        if (isHead) {                                      // 桌头：绕到桌左缘外入座（不穿会议桌）
          pts[2] = { x: RIGHT_X, y: TBL_TOP };
          pts.push({ x: 790, y: TBL_TOP }, { x: 790, y: to.y });
        }
        pts.push({ x: to.x, y: to.y });
      } else {                                             // lounge：走左侧走廊进会客区
        pts.push({ x: from.x, y: sy }, { x: LEFT_X, y: sy }, { x: LEFT_X, y: to.y }, { x: to.x, y: to.y });
      }
    } else if (fz === 'meeting') {
      if (tz === 'desk') {
        if (from.y >= 110 && from.y <= 195) {              // 桌头：x<824 先竖下出桌区
          pts.push({ x: from.x, y: AISLE_Y }, { x: RIGHT_X, y: AISLE_Y });
        } else {                                           // 上/下排：横向出会议室右侧
          pts.push({ x: RIGHT_X, y: from.y });
        }
        pts.push({ x: RIGHT_X, y: wy }, { x: to.x, y: wy }, { x: to.x, y: to.y });
      } else {                                             // lounge
        if (from.y >= 110 && from.y <= 195) {
          pts.push({ x: from.x, y: AISLE_Y });             // 桌头：竖下（x<824 不穿桌）
        } else {
          pts.push({ x: 790, y: from.y }, { x: 790, y: AISLE_Y });  // 横出桌左缘再竖下
        }
        pts.push({ x: LEFT_X, y: AISLE_Y }, { x: LEFT_X, y: to.y }, { x: to.x, y: to.y });
      }
    } else {                                               // lounge 出发
      if (tz === 'meeting') {
        pts.push({ x: from.x, y: AISLE_Y }, { x: RIGHT_X, y: AISLE_Y }, { x: RIGHT_X, y: to.y });
        if (isHead) {
          pts[2] = { x: RIGHT_X, y: TBL_TOP };
          pts.push({ x: 790, y: TBL_TOP }, { x: 790, y: to.y });
        }
        pts.push({ x: to.x, y: to.y });
      } else {                                             // desk
        if (to.y >= 455) {                                 // 下排目标：绕左下走廊，避免竖穿两排工位
          pts.push({ x: from.x, y: AISLE_Y }, { x: LEFT_X, y: AISLE_Y }, { x: LEFT_X, y: BOT_Y }, { x: to.x, y: BOT_Y }, { x: to.x, y: to.y });

  // —— 迷你 markdown 渲染（零依赖；先转义防注入，再行级/内联转换）——
  function inlineMd(s) {
    var re = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g;
    return s.replace(re, function (m) {
      if (m.charAt(0) === '`') return '<code>' + m.slice(1, -1) + '</code>';
      if (m.slice(0, 2) === '**') return '<strong>' + m.slice(2, -2) + '</strong>';
      if (m.charAt(0) === '*') return '<em>' + m.slice(1, -1) + '</em>';
      var a = m.indexOf('](');
      return '<a href="' + m.slice(a + 2, -1) + '" target="_blank" rel="noopener noreferrer">' + m.slice(1, a) + '</a>';
    });
  }
  function mdToHtml(md) {

      codeBlocks.push('<pre><code>' + esc(m.slice(3, -3).replace(/^\n|\n\s*$/g, '')) + '</code></pre>');
      return '\u0000C' + (codeBlocks.length - 1) + '\u0000';

    var lines = md.split('\n');
    var html = [], tbl = [], list = null, inP = false;
    function flushTbl() {
      if (!tbl.length) return;
      var rows = tbl.map(function (l) {
        return l.replace(/^\s*\|?/, '').replace(/\|?\s*$/, '').trim().split('|').map(function (c) { return c.trim(); });
      });
      html.push('<table>');
      rows.forEach(function (cells, ri) {
        if (ri === 1 && cells.every(function (c) { return /^:?-{2,}:?$/.test(c); })) return; // 分隔行
        var tag = ri === 0 ? 'th' : 'td';
        html.push('<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c) + '</' + tag + '>'; }).join('') + '</tr>');
      });
      html.push('</table>');
      tbl = [];
    }
    function closeP() { if (inP) { html.push('</p>'); inP = false; } }
    function closeList() { if (list) { html.push('</' + list + '>'); list = null; } }
    lines.forEach(function (line) {
      var t = line.trim();
      if (!t) { flushTbl(); closeP(); closeList(); return; }
      if (t.indexOf('|') >= 0) { closeP(); closeList(); tbl.push(t); return; }
      flushTbl();
      var m;
      if (t === '---' || /^(\*\s*){3,}$/.test(t)) { closeP(); closeList(); html.push('<hr/>'); return; }
      if ((m = t.match(/^(#{1,3})\s+(.*)$/))) { closeP(); closeList(); var h = m[1].length; html.push('<h' + h + '>' + inlineMd(m[2]) + '</h' + h + '>'); return; }
      if ((m = t.match(/^>\s?(.*)$/))) { closeP(); closeList(); html.push('<blockquote>' + inlineMd(m[1]) + '</blockquote>'); return; }
      if ((m = t.match(/^[-*]\s+(.*)$/))) { if (list !== 'ul') { closeList(); closeP(); html.push('<ul>'); list = 'ul'; } html.push('<li>' + inlineMd(m[1]) + '</li>'); return; }
      if ((m = t.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); closeP(); html.push('<ol>'); list = 'ol'; } html.push('<li>' + inlineMd(m[1]) + '</li>'); return; }
      if (!inP) { html.push('<p>'); inP = true; }
      html.push(inlineMd(t));
    });
    flushTbl(); closeP();
    if (list) html.push('</' + list + '>');
    // 4) 恢复代码块
    var out = html.join('').replace(/\u0000C(\d+)\u0000/g, function (m, i) { return codeBlocks[+i]; });
    return out;
  }

  // —— 全局轻提示 / 弹窗通用行为 ——
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
  document.querySelectorAll('.modal-mask').forEach(function (mask) {
    mask.addEventListener('click', function (e) { if (e.target === mask) hideModal(mask.id); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.querySelectorAll('.modal-mask.show').forEach(function (m) { hideModal(m.id); });
  });

  // —— 恢复上次体验（localStorage 记住 demo_id；在飞则重连 SSE 继续看进度）——
  if (lastDemoId) {
    fetch('https://mrd.hermes.cc.cd/api/opc/demo/status?demo_id=' + encodeURIComponent(lastDemoId))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var d = res && res.ok && res.data;
        if (!d) return;
        currentDemo = { demo_id: d.demo_id, task_id: d.task_id };
        if (d.status !== 'completed' && d.status !== 'failed') {
          switchTab('kanban');
          showProgress(d);
          connectDemoStream(d.demo_id);
        } else {
          showProgress(d); // 终态也展示（查看报告入口），不自动切 tab
        }
      }).catch(function () {});
  }
})();
</script>
</body>
</html>
