<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>连接失败 — 市场研究驾驶舱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070b12; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 24px;
      padding: 48px; text-align: center;
    }
    .logo { width: 72px; height: 72px; border-radius: 12px; background: #22d3ee20; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    h1 { font-size: 18px; font-weight: 600; }
    p { font-size: 13px; color: #94a3b8; max-width: 360px; line-height: 1.6; }
    .btns { display: flex; gap: 12px; }
    button {
      font-size: 13px; padding: 8px 20px; border-radius: 6px; cursor: pointer;
      border: 1px solid #334155; font-weight: 600;
    }
    .primary { background: #22d3ee15; border-color: #22d3ee40; color: #22d3ee; }
    .secondary { background: transparent; color: #94a3b8; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="logo">📡</div>
  <h1>无法连接服务器</h1>
  <p>请确认服务器可访问，或修改服务器地址后重试。</p>
  <div class="btns">
    <button class="primary" onclick="retry()">重试</button>
    <button class="secondary" onclick="settings()">服务器设置</button>
  </div>
  <script>
    async function retry() {
      try { await window.__TAURI_INTERNALS__.invoke("reload_app"); } catch (_) { location.reload(); }
    }
    async function settings() {
      try { await window.__TAURI_INTERNALS__.invoke("open_settings"); } catch (_) {}
    }
  </script>
</body>
</html>
